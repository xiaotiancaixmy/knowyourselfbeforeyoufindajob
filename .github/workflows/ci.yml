name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test production API
        run: |
          API_PORT=3101 API_HOST=127.0.0.1 DATABASE_PATH=/tmp/kys-ci.db DEEPSEEK_API_KEY=your_deepseek_api_key_here pnpm --filter @kys/api start > /tmp/kys-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3101/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/kys-api.log
          exit 1

      - name: Verify legacy Python reference
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
